<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student - Student Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">
                🎓 Student Management System
            </a>
            <div class="ms-auto">
                <a href="{{ url_for('index') }}" class="btn btn-outline-light btn-sm">
                    &larr; Back to Dashboard
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <!-- Flash Messages -->
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <!-- Edit Student Card -->
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white py-3 border-bottom">
                        <h4 class="mb-0 fw-bold text-dark">✏️ Edit Student</h4>
                        <small class="text-muted">Update details for Student #{{ student['id'] }}.</small>
                    </div>
                    <div class="card-body p-4">
                        <form action="{{ url_for('edit_student', id=student['id']) }}" method="POST">
                            
                            <!-- Student ID (Readonly) -->
                            <div class="mb-3">
                                <label for="id" class="form-label fw-semibold text-muted">Student ID (Auto-generated)</label>
                                <input type="text" class="form-control bg-light" id="id" 
                                       value="#{{ student['id'] }}" readonly disabled>
                            </div>

                            <!-- Student Name -->
                            <div class="mb-3">
                                <label for="name" class="form-label fw-semibold">Student Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="name" name="name" 
                                       value="{{ student['name'] }}" required>
                            </div>

                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" id="email" name="email" 
                                       value="{{ student['email'] }}" required>
                            </div>

                            <!-- Course -->
                            <div class="mb-3">
                                <label for="course" class="form-label fw-semibold">Course <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="course" name="course" 
                                       value="{{ student['course'] }}" required>
                            </div>

                            <!-- Phone Number -->
                            <div class="mb-4">
                                <label for="phone" class="form-label fw-semibold">Phone Number <span class="text-danger">*</span></label>
                                <input type="tel" class="form-control" id="phone" name="phone" 
                                       value="{{ student['phone'] }}" required>
                            </div>

                            <!-- Buttons -->
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary fw-semibold px-4">
                                    Update Student
                                </button>
                                <a href="{{ url_for('index') }}" class="btn btn-secondary px-3">
                                    Cancel
                                </a>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JavaScript Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
